org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled for this spike because the
# project (D:) and the pub cache (C:) live on different Windows drives.
# Kotlin's incremental cache tries to store a relative path between plugin
# sources and the project root, which is impossible across drive letters and
# throws "this and base files have different roots". Spike-only workaround —
# this is not something lib/mesh/ needs to inherit, just move the SDK/pub
# cache and the repo onto the same drive if it recurs there.
kotlin.incremental=false
